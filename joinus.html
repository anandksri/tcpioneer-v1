    <main>
        <section class="container mt-5">
            <div class="card-body ">
                <h4 class="text-center p-3 " style="color: transparent; line-height: 1.9rem; letter-spacing: 0.08rem; font-family: sans-serif;
                background: linear-gradient(to right, #f5f4f4, #e9e5e1); -webkit-background-clip: text;">We are excited
                    to have you join our community &hearts;</h4>

            </div>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h3 class="text-center mb-0"
                                style="background: linear-gradient(to right, #ff7e5f, #feb47b); -webkit-background-clip: text; color: transparent;">
                                Join Us &HumpDownHump;</h3>
                        </div>
                        <div class="card-body">
                            <form action="#" method="POST">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="name" placeholder="Enter your full name"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email"
                                        required>
                                </div>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone"
                                        placeholder="Enter your phone number" required>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" id="message" rows="4"
                                        placeholder="Tell us why you want to join" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-dark">Submit</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
